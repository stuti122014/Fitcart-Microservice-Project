vapiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitcart-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fitcart-backend-service
            port:
              number: 8080
