apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitcart-ingress
  namespace: dev-crud-app
  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: "/api/gym/records"
spec:
  ingressClassName: azure-application-gateway
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fitcart-backend-service
            port:
              number: 8080

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
