apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitcart-ingress
  namespace: dev-crud-app
  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: "/"

spec:
  ingressClassName: azure-application-gateway

  rules:
  - host: ashvani.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
